# live-chat-eval Docker Compose 配置
# 用法：docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-chat-eval-app
    container_name: lce-app
    restart: unless-stopped
    ports:
      # APP_HOST / APP_PORT 控制宿主机侧绑定地址和端口（默认仅本机访问）
      # 若需局域网访问：APP_HOST=0.0.0.0 docker compose up
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8787}:8787"
    volumes:
      # 持久化数据卷（SQLite 数据库）
      - lce_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      LCE_DB_PATH: /app/data/app.db
    extra_hosts:
      # Linux 用户访问宿主机本地服务（Ollama / CCH）时使用 host.docker.internal
      - "host.docker.internal:host-gateway"

volumes:
  lce_data:
    name: lce_data
